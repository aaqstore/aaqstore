<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAQ Store</title>
  <style>
    :root { --bg-dark: #090d16; --card-bg: #111827; --border-color: #1f2937; --text-main: #ffffff; --text-muted: #9ca3af; --accent-red: #ff3366; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; }
    header { background-color: var(--card-bg); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .brand-logo img { height: 35px; width: auto; display: block; object-fit: contain; }
    .back-btn { color: var(--text-main); text-decoration: none; font-size: 0.9rem; background: var(--border-color); padding: 6px 12px; border-radius: 6px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 15px; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-left: 4px solid var(--accent-red); padding-left: 10px; }
    .empty-content { background-color: var(--card-bg); border: 1px dashed var(--border-color); padding: 40px; text-align: center; border-radius: 10px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <div class="brand-logo">
      <img src="images/logo1.jpg" alt="AAQ STORE Logo">
    </div>
  </header>
  <div class="container">
    <div class="section-title">Halaman Informasi</div>
    <div class="empty-content">
      [ Konten halaman ini akan segera diisi ]
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimoni & Bukti Transaksi - AAQ Store</title>
  <style>
    :root { --bg-dark: #090d16; --card-bg: #111827; --border-color: #1f2937; --text-main: #ffffff; --text-muted: #9ca3af; --accent-red: #ff3366; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; }
    header { background-color: var(--card-bg); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .brand-logo img { height: 35px; width: auto; display: block; object-fit: contain; }
    .back-btn { color: var(--text-main); text-decoration: none; font-size: 0.9rem; background: var(--border-color); padding: 6px 12px; border-radius: 6px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 15px; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-left: 4px solid var(--accent-red); padding-left: 10px; }
    .reputation-box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-red); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-size: 1rem; font-weight: 600; color: #e5e7eb; text-align: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
    .reputation-box span { color: var(--accent-red); }
    .content-box { background-color: var(--card-bg); border: 1px dashed var(--border-color); padding: 40px 20px; border-radius: 10px; color: var(--text-muted); text-align: center; }
    .drive-link { display: inline-block; margin-top: 15px; background-color: var(--accent-red); color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: 0.2s; }
    .drive-link:hover { background-color: #cc0033; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <div class="brand-logo">
      <img src="images/logo1.jpg" alt="AAQ STORE Logo">
    </div>
  </header>
  <div class="container">
    <div class="section-title">Dokumentasi & Bukti Transaksi</div>
    <div class="reputation-box">
      <span>5 Tahun Melayani Gamers</span> • Ribuan Testimoni & Bukti Transaksi Nyata
    </div>
    <div class="content-box">
      <p>Silakan klik tombol di bawah ini untuk melihat seluruh arsip bukti transaksi dan testimoni pelanggan AAQ Store:</p>
      <a href="https://drive.google.com/drive/folders/13u9oQeqt7kB7k1SIxVGSmuPSnuWrjTzY" target="_blank" class="drive-link">📂 Buka Folder Google Drive Testimoni</a>
    </div>
  </div>
</body>
</html>
